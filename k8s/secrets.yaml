apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: pedidos-express
type: Opaque
stringData:
  POSTGRES_DB: pedidos_express
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres  # Em produção, use um secret manager!
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: pedidos_express
  DB_USER: postgres
  DB_PASSWORD: postgres
