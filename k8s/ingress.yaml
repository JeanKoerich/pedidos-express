apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedidos-ingress
  namespace: pedidos-express
  annotations:
    kubernetes.io/ingress.class: traefik  # K3s default ingress controller
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
